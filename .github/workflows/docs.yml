name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # mkdocstrings needs full history for git dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs deps
        run: pip install -r docs/requirements.txt

      - name: Install fujicv (no torch — just for import resolution)
        run: pip install -e "." --no-deps

      - name: Build & deploy
        run: mkdocs gh-deploy --force
